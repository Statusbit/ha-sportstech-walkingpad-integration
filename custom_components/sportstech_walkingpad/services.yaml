start:
  name: Starten
  description: Startet das Laufband und ordnet optional einen Benutzer zu.
  fields:
    user:
      name: Benutzer
      description: Optionaler Benutzername für das Training.
      example: Flo
      selector:
        text:

stop:
  name: Stoppen
  description: Stoppt das Laufband.

pause:
  name: Pausieren
  description: Pausiert das Laufband.

set_speed:
  name: Geschwindigkeit setzen
  description: Setzt die Laufbandgeschwindigkeit in km/h.
  fields:
    speed:
      name: Geschwindigkeit
      description: Zielgeschwindigkeit in km/h.
      required: true
      example: 4.5
      selector:
        number:
          min: 0
          max: 25
          step: 0.1
          unit_of_measurement: km/h

set_incline:
  name: Neigung setzen
  description: Setzt die Neigung des Laufbands in Prozent.
  fields:
    incline:
      name: Neigung
      description: Zielneigung in Prozent.
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 15
          step: 1
          unit_of_measurement: "%"

assign_user:
  name: Benutzer zuweisen
  description: Weist das aktuelle oder zuletzt beendete Workout einem Benutzer zu.
  fields:
    user:
      name: Benutzer
      description: Name des Trainingsbenutzers.
      required: true
      example: Flo
      selector:
        text:
